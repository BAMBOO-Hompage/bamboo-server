name: CI/CD Pipeline with Docker


on:
  push:
    branches: [ develop ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Create .env file for Docker build
        run: |
          cat > .env << EOF
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_URL=${{ secrets.DB_URL }}
          REDIS_HOST=${{ secrets.REDIS_HOST }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          MAIL_SENDER=${{ secrets.MAIL_SENDER }}
          MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
          MAIL_AUTH_CODE_EXPIRATION=${{ secrets.MAIL_AUTH_CODE_EXPIRATION }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          ACCESS_EXPIRATION_TIME=${{ secrets.ACCESS_EXPIRATION_TIME }}
          REFRESH_EXPIRATION_TIME=${{ secrets.REFRESH_EXPIRATION_TIME }}
          S3_ACCESS_KEY=${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY=${{ secrets.S3_SECRET_KEY }}
          S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}
          EOF

      - name: Build and Push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            jinseok19/bamboo-server:latest
            jinseok19/bamboo-server:${{ github.sha }}
          cache-from: type=registry,ref=jinseok19/bamboo-server:latest
          cache-to: type=inline

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          echo "$EC2_SSH_KEY" > private_key.pem
          chmod 600 private_key.pem
          
          # EC2에서 Docker로 배포
          ssh -i private_key.pem -o StrictHostKeyChecking=no $EC2_USERNAME@$EC2_HOST "
            # Docker pull
            docker pull jinseok19/bamboo-server:latest
            
            # 배포 스크립트 실행
            chmod +x /home/$EC2_USERNAME/deploy-docker.sh
            /home/$EC2_USERNAME/deploy-docker.sh
          "
          
          rm -f private_key.pem