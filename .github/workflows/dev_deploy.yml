name: CI/CD Pipeline with Docker


on:
  push:
    branches: [ develop ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Create .env file for Docker build
        run: |
          cat > .env << EOF
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_URL=${{ secrets.DB_URL }}
          REDIS_HOST=${{ secrets.REDIS_HOST }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          MAIL_SENDER=${{ secrets.MAIL_SENDER }}
          MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
          MAIL_AUTH_CODE_EXPIRATION=${{ secrets.MAIL_AUTH_CODE_EXPIRATION }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          ACCESS_EXPIRATION_TIME=${{ secrets.ACCESS_EXPIRATION_TIME }}
          REFRESH_EXPIRATION_TIME=${{ secrets.REFRESH_EXPIRATION_TIME }}
          S3_ACCESS_KEY=${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY=${{ secrets.S3_SECRET_KEY }}
          S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}
          EOF

      - name: Build and Push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            jinseok19/bamboo-server:latest
            jinseok19/bamboo-server:${{ github.sha }}
          cache-from: type=registry,ref=jinseok19/bamboo-server:latest
          cache-to: type=inline

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          echo "$EC2_SSH_KEY" > private_key.pem
          chmod 600 private_key.pem
          
          # EC2에서 Docker로 배포
          ssh -i private_key.pem -o StrictHostKeyChecking=no $EC2_USERNAME@$EC2_HOST << 'ENDSSH'
            set -e  # 에러 발생 시 중단
            
            echo "🐳 Docker 이미지 Pull 중..."
            docker pull jinseok19/bamboo-server:latest
            
            echo "🔹 기존 Java 프로세스 종료..."
            pkill -f BambooServer || true
            
            echo "🔹 기존 컨테이너 종료 및 제거..."
            docker stop bamboo-server || true
            docker rm bamboo-server || true
            
            echo "🚀 새 컨테이너 시작..."
            docker run -d \
              --name bamboo-server \
              --env-file /home/ubuntu/.env \
              -p 8080:8080 \
              --restart unless-stopped \
              jinseok19/bamboo-server:latest
            
            echo "⏳ 컨테이너 시작 대기 (45초)..."
            sleep 45
            
            echo "🔍 Health check..."
            SUCCESS=0
            for i in {1..15}; do
              if curl -f http://localhost:8080/health > /dev/null 2>&1; then
                echo "✅ 배포 성공!"
                docker ps --filter "name=bamboo-server"
                docker logs bamboo-server --tail 50
                SUCCESS=1
                break
              fi
              echo "   재시도 ($i/15)..."
              sleep 5
            done
            
            if [ $SUCCESS -eq 1 ]; then
              echo "🎉 최종 성공!"
              exit 0
            else
              echo "❌ Health check 실패!"
              docker logs bamboo-server --tail 100
              exit 1
            fi
          ENDSSH
          
          # SSH 종료 코드 확인
          SSH_EXIT=$?
          rm -f private_key.pem
          
          # SSH 내부에서 성공했으면 0, 실패했으면 1
          if [ $SSH_EXIT -eq 0 ]; then
            echo "🎉 배포 완료!"
            exit 0
          else
            echo "❌ 배포 실패! (Exit code: $SSH_EXIT)"
            exit 1
          fi