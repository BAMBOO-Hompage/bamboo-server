version: "3.8"

services:
  # Redis 캐시
  redis:
    image: redis:7-alpine
    container_name: bamboo-redis-prod
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - bamboo-network

  # Spring Boot 애플리케이션
  bamboo:
    image: jinseok19/bamboo-server:latest
    container_name: bamboo-server
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    networks:
      - bamboo-network
    environment:
      - REDIS_HOST=redis
      - TZ=Asia/Seoul

volumes:
  redis_data:
    driver: local

networks:
  bamboo-network:
    driver: bridge
