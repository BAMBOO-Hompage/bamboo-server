version: "3.8"

services:
  # MySQL 데이터베이스
  mysql:
    image: mysql:8.0
    container_name: bamboo-mysql
    environment:
      MYSQL_ROOT_PASSWORD: bamboo_root_password
      MYSQL_DATABASE: bamboo_db
      MYSQL_USER: bamboo_user
      MYSQL_PASSWORD: bamboo_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - bamboo-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 캐시
  redis:
    image: redis:7-alpine
    container_name: bamboo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - bamboo-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Grafana (기존 모니터링 시스템과 통합)
  grafana:
    image: grafana/grafana
    container_name: bamboo-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana-provisioning:/etc/grafana/provisioning
      - ./grafana-dashboard:/dashboard
    depends_on:
      - prometheus
    networks:
      - bamboo-network

  # Prometheus (기존 모니터링 시스템과 통합)
  prometheus:
    image: prom/prometheus
    container_name: bamboo-prometheus
    ports:
      - "9090:9090"
    command:
      - --web.enable-remote-write-receiver
      - --enable-feature=native-histograms
      - --config.file=/etc/prometheus/prometheus.yml
    networks:
      - bamboo-network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  bamboo-network:
    driver: bridge
